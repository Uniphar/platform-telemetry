name: CD for Uniphar.Platform.Telemetry project

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/uniphar-platform-telemetry-cd.yaml
      - src/Uniphar.Platform.Telemetry/**

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  Package_CD:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/Uniphar.Platform.Telemetry

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.x"

      - name: Update Version in .csproj
        shell: pwsh
        run: |
          $csprojPath = "Uniphar.Platform.Telemetry.csproj"
          $runNumber = "${{github.run_number}}"
          $content = Get-Content $csprojPath -Raw

          # Match and extract current version
          if ($content -match '<Version>(.*?)<\/Version>') {
              $currentVersion = $Matches[1]
              $newVersion = "$currentVersion.$runNumber"
              $content = $content -replace '<Version>(.*?)<\/Version>', "<Version>$newVersion</Version>"
              Set-Content $csprojPath $content
              Write-Output "Updated version to $newVersion in $csprojPath"
          } else {
              Write-Error "Could not find a <Version> tag in $csprojPath"
          }

      - name: Restore Dependencies
        run: dotnet restore --no-cache --force

      - name: Dotnet Pack
        run: dotnet pack --configuration Release --output ./.nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.UNI_NUGET_USER }}

      - name: Dotnet NuGet Push
        working-directory: ./src/Uniphar.Platform.Telemetry
        run: dotnet nuget push ./.nupkgs/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{steps.login.outputs.NUGET_API_KEY}}
